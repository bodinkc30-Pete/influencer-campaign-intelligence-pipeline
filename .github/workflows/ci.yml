name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-quality:
    name: Fast Quality Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run regression tests
        run: python -m pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

  postgres-integration:
    name: PostgreSQL Integration Gate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Run real PostgreSQL integration harness
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          python tests/integration/run_postgres_integration.py \
            --host localhost \
            --port 5432 \
            --user postgres \
            --admin-database postgres \
            --psql-path "$(command -v psql)"
